<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <!-- App icon -->
    <link rel="apple-touch-icon" href="icon.png">
    <title>Weather App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.8/dist/vapor/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>

<body class="bg-dark">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card border shadow-lg">
                    <div class="card-body p-4">

                        <!-- Title header area -->
                        <div class="text-center mb-4">
                            <h1 class="mb-1">Weather App</h1>
                            <p class="text-muted mb-0">Current Weather Conditions</p>
                        </div>

                        <!-- Location display -->
                        <div class="alert alert-primary text-center mb-4">
                            <h4 class="mb-0" id="txtLocation">Cookeville, TN</h4>
                        </div>

                        <!-- Weather temp and condition display -->
                        <div class="text-center mb-4">
                            <i id="icoWeather" class="bi bi-cloud" style="font-size: 4rem;"></i>
                            <h2 class="mt-3 mb-1" id="txtTemperature">-- °F</h2>
                            <p class="lead mb-0" id="txtCondition">Loading...</p>
                        </div>
                        <!-- Humidity and UV display -->
                        <div class="row text-center g-3 mb-4">
                            <div class="col-6">
                                <div class="border rounded p-3 h-100">
                                    <h6>Humidity</h6>
                                    <p class="mb-0 fs-5" id="txtHumidity">--%</p>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="border rounded p-3 h-100">
                                    <h6>UV Index</h6>
                                    <p class="mb-0 fs-5" id="txtUVIndex">--</p>
                                </div>
                            </div>
                        </div>

                        <!-- Button for refreshing-->
                        <div class="d-grid mb-3">
                            <button class="btn btn-primary" id="btnGetWeather" type="button">Refresh Weather</button>
                        </div>

                        <!-- Footer containing the reference to Meteo-->
                        <div class="text-center mt-3">
                            <small>Weather data courtesy of <a href="https://open-meteo.com/" target="_blank">Open-Meteo</a></small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    let strURL = "https://api.open-meteo.com/v1/forecast?latitude=36.1628&longitude=-85.5016&daily=uv_index_max&hourly=temperature_2m,relative_humidity_2m,rain,precipitation,uv_index,is_day&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code,precipitation,showers,rain,snowfall&timezone=auto&forecast_days=1&wind_speed_unit=mph&temperature_unit=fahrenheit&precipitation_unit=inch"

    function getWeather() {
        fetch(strURL)
            .then(response => response.json())
            .then(data => {
                let objCurrent = data.current
                let decTemp = objCurrent.temperature_2m
                let intHumidity = objCurrent.relative_humidity_2m
                let intWeatherCode = objCurrent.weather_code
                let decUVIndex = data.daily.uv_index_max[0]

                // Displays the temp and humidity
                document.querySelector('#txtTemperature').innerHTML = Math.round(decTemp) + " °F"
                document.querySelector('#txtHumidity').innerHTML = intHumidity + "%"
                document.querySelector(`#txtUVIndex`).innerHTML = decUVIndex

                let strIconClass = "bi bi-cloud fs-1"
                let strCondition = "Unknown Conditions"

                // if statements to decide on weather condition
                if (intWeatherCode == 0) {
                    strIconClass = "bi bi-sun fs-1"
                    strCondition = "Clear Sky"
                }
                else if (intWeatherCode >= 1 && intWeatherCode <= 3) {
                    strIconClass = "bi bi-cloud-sun fs-1"
                    strCondition = "Cloudy"
                }
                else if (intWeatherCode >= 45 && intWeatherCode <= 48) {
                    strIconClass = "bi bi-cloud-fog fs-1"
                    strCondition = "Foggy"
                }
                else if (intWeatherCode >= 51 && intWeatherCode <= 67) {
                    strIconClass = "bi bi-cloud-rain fs-1"
                    strCondition = "Rainy"
                }
                else if (intWeatherCode >= 80 && intWeatherCode <= 82) {
                    strIconClass = "bi bi-cloud-rain fs-1"
                    strCondition = "Rainy"
                }
                else if (intWeatherCode >= 71 && intWeatherCode <= 77) {
                    strIconClass = "bi bi-snow fs-1"
                    strCondition = "Snowy"
                }
                else if (intWeatherCode >= 85 && intWeatherCode <= 86) {
                    strIconClass = "bi bi-snow fs-1"
                    strCondition = "Snowy"
                }
                else if (intWeatherCode >= 95 && intWeatherCode <= 99) {
                    strIconClass = "bi bi-cloud-lightning-rain fs-1"
                    strCondition = "Thunderstorm"
                }

                // Display the condition and icon for it
                document.querySelector('#txtCondition').innerHTML = strCondition
                document.querySelector('#icoWeather').className = strIconClass
            })
    }

    document.querySelector('#btnGetWeather').addEventListener('click', function () {
        getWeather()
    })

    getWeather()

</script> 
<!-- ChatGPT was used to help improve the styling of the app and to explain how to host it on GitHub Pages and add it to a mobile device. -->

</body>
</html>
